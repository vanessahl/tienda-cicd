global:
  scrape_interval: 15s       # cada cuánto se leen las métricas
  evaluation_interval: 15s   # cada cuánto se evalúan las alertas

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tienda-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
